<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kidsney — sport meets play</title>
<meta name="description" content="Kidsney turns kids' exercise into a cartoon fighting adventure. Camera-powered workouts, a quest world of 10 sports, and heroes that grow with your child." />
<style>
  :root {
    --bg: #0e1220; --surface: #1a2138; --primary: #4f7cff; --accent: #ffb020;
    --success: #34d17b; --danger: #ff5c6c; --text: #f4f6ff; --dim: #9aa7c7;
    --stroke: #2c3555;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: radial-gradient(120% 80% at 50% -10%, #1a2450 0%, var(--bg) 55%);
    color: var(--text);
    font-family: "Nunito", "Segoe UI", system-ui, sans-serif;
    min-height: 100vh;
  }
  .lang { position: fixed; top: 14px; right: 14px; display: flex; gap: 6px; z-index: 10; }
  .lang button {
    background: var(--surface); color: var(--dim);
    border: 1px solid var(--stroke); border-radius: 999px; padding: 6px 14px;
    font-weight: 800; cursor: pointer; font-size: 14px;
  }
  .lang button.on { background: var(--primary); color: #fff; }
  header { max-width: 1024px; margin: 0 auto; padding: 64px 20px 8px; text-align: center; }
  .badge {
    display: inline-block; background: var(--surface); color: var(--accent);
    border-radius: 999px; padding: 6px 16px; font-weight: 800; font-size: 13px;
    letter-spacing: .08em; text-transform: uppercase; margin-bottom: 18px;
  }
  h1 { font-size: clamp(30px, 6vw, 52px); line-height: 1.12; font-weight: 900; }
  h1 em { color: var(--accent); font-style: normal; }
  .sub { color: var(--dim); font-size: clamp(16px, 2.4vw, 20px); max-width: 660px; margin: 16px auto 0; line-height: 1.5; }
  .stores { display: flex; gap: 14px; justify-content: center; margin-top: 26px; flex-wrap: wrap; }
  .store {
    display: inline-flex; align-items: center; gap: 12px; text-decoration: none;
    background: #000; border: 1px solid #3a4468; border-radius: 14px; padding: 10px 20px;
  }
  .store svg { width: 28px; height: 28px; fill: #fff; }
  .store small { display: block; color: var(--dim); font-size: 11px; font-weight: 700; letter-spacing: .04em; }
  .store b { color: #fff; font-size: 18px; font-weight: 900; }

  .wrap { max-width: 1024px; margin: 0 auto; padding: 0 20px; }

  /* heroes strip */
  .heroes { margin: 44px auto 8px; overflow: hidden; border-block: 1px solid var(--stroke); }
  .heroes img { display: block; width: 100%; }

  section h2 {
    text-align: center; font-size: clamp(24px, 4vw, 34px); font-weight: 900;
    margin: 56px 0 8px;
  }
  .lead { text-align: center; color: var(--dim); max-width: 640px; margin: 0 auto 28px; line-height: 1.55; }

  /* phone frames */
  .phones { display: flex; gap: 22px; justify-content: center; flex-wrap: wrap; }
  .phone {
    width: 230px; border-radius: 34px; padding: 10px;
    background: linear-gradient(180deg, #2b3352, #141a30);
    box-shadow: 0 24px 50px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.12);
  }
  .phone img { display: block; width: 100%; border-radius: 26px; }
  .phone p { text-align: center; color: var(--dim); font-size: 13px; font-weight: 700; padding: 10px 4px 4px; }

  .arena { margin: 48px auto; border-radius: 24px; overflow: hidden; border: 1px solid var(--stroke);
    box-shadow: 0 24px 60px rgba(0,0,0,.5); }
  .arena img { display: block; width: 100%; }

  .cards {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px;
    margin: 8px auto 40px;
  }
  .card {
    background: var(--surface); border-radius: 18px; padding: 22px;
    box-shadow: 0 10px 26px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.07);
  }
  .card h3 { font-size: 19px; margin-bottom: 8px; }
  .card p { color: var(--dim); font-size: 15px; line-height: 1.55; }

  /* FAQ */
  .faq { max-width: 760px; margin: 0 auto 48px; }
  details {
    background: var(--surface); border: 1px solid var(--stroke); border-radius: 14px;
    margin-bottom: 10px; padding: 4px 18px;
  }
  summary {
    cursor: pointer; font-weight: 800; font-size: 16px; padding: 12px 0;
    list-style: none; position: relative; padding-right: 30px;
  }
  summary::after {
    content: "+"; position: absolute; right: 4px; top: 10px;
    font-size: 22px; color: var(--accent); font-weight: 900;
  }
  details[open] summary::after { content: "–"; }
  details p { color: var(--dim); font-size: 15px; line-height: 1.6; padding: 0 0 14px; }

  footer { text-align: center; color: var(--dim); font-size: 14px; padding: 0 20px 40px; }
  footer a { color: var(--primary); text-decoration: none; margin: 0 8px; }
  .hidden { display: none; }
</style>
</head>
<body>

  <section class="wrap">

    <div class="cards">

function setLang(l) {
  document.documentElement.lang = l === "uk" ? "uk" : l;
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    const v = T[l][el.dataset.i18n];
    if (v != null) el.innerHTML = v;
  });
  document.querySelectorAll(".lang button").forEach((b) => b.classList.toggle("on", b.dataset.lang === l));
  try { localStorage.setItem("kidsney-site-lang", l); } catch {}
}
document.querySelectorAll(".lang button").forEach((b) => (b.onclick = () => setLang(b.dataset.lang)));
let lang = "en";
try { lang = localStorage.getItem("kidsney-site-lang") || ((navigator.language || "").startsWith("uk") ? "uk" : (navigator.language || "").startsWith("de") ? "de" : "en"); } catch {}
setLang(T[lang] ? lang : "en");
