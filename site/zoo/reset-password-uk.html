<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kidsney Zoo — Новий пароль</title><style>body{margin:0;background:#f4f8fc;color:#2b2118;font:16px/1.55 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,Roboto,sans-serif}

<body><main><nav><a href="reset-password-en.html">English</a> · Українська · <a href="reset-password-de.html">Deutsch</a></nav><h1>Новий пароль</h1>
<form id="f"><label>Новий пароль (щонайменше 8 символів)<br><input id="p" type="password" minlength="8" autocomplete="new-password" required style="font-size:18px;padding:8px;width:100%;max-width:320px"></label>
<p><button type="submit" style="font-size:18px;padding:10px 20px">Зберегти</button></p></form>
<p id="m" role="status"></p>
<script>
(function(){
  var h=new URLSearchParams(location.hash.slice(1)), t=h.get("access_token");
  var f=document.getElementById("f"), m=document.getElementById("m");
  if(!t){ f.hidden=true; m.textContent="Не вдалося. Відкрийте посилання з листа ще раз."; return; }
  history.replaceState(null,"",location.pathname);
  f.addEventListener("submit",function(e){
    e.preventDefault();
    var p=document.getElementById("p").value; if(p.length<8) return;
    fetch("https://wvmbqzyfliljhlrkhazc.supabase.co/auth/v1/user",{method:"PUT",headers:{"apikey":"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind2bWJxenlmbGlsamhscmtoYXpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ3NTIxMTksImV4cCI6MjExMDMyODExOX0.hHmn-25dx82vhPBdMP0k1V852udLrgsCl3H9eSxFeSI","Authorization":"Bearer "+t,"Content-Type":"application/json"},body:JSON.stringify({password:p})})
      .then(function(r){ f.hidden=r.ok; m.textContent=r.ok?"Готово! Поверніться до гри й увійдіть з новим паролем.":"Не вдалося. Відкрийте посилання з листа ще раз."; })
      .catch(function(){ m.textContent="Не вдалося. Відкрийте посилання з листа ще раз."; });
  });
})();
</script>
</main></body></html>
